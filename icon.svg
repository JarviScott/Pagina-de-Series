<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#120a1c"/>
  <!-- TV Cabinet Outer -->
  <rect x="32" y="80" width="448" height="352" rx="32" fill="#2d1f47" stroke="#ffffff" stroke-width="16"/>
  <!-- Bezel Inner -->
  <rect x="56" y="104" width="400" height="304" rx="20" fill="#1b122e"/>
  <!-- CRT Screen (Magenta border, black screen) -->
  <rect x="76" y="124" width="360" height="216" rx="12" fill="#000000" stroke="#ff0055" stroke-width="12"/>
  <!-- Play Icon (Neon Cyan) -->
  <polygon points="220,180 320,232 220,284" fill="#00f0ff" stroke="#00f0ff" stroke-width="8" stroke-linejoin="round"/>
  <!-- Indicators on screen bottom -->
  <circle cx="110" cy="370" r="12" fill="#ff0055"/>
  <rect x="150" y="362" width="60" height="16" rx="4" fill="#ffff00"/>
  <rect x="230" y="362" width="60" height="16" rx="4" fill="#00ff66"/>
  <!-- Antennas -->
  <line x1="256" y1="80" x2="176" y2="24" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="80" x2="336" y2="24" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
</svg>
